 lengthAdjust="spacing" textLength="202.2422" x="1297.1548" y="405.3965">(three quick ones on the first beat)</text><rect fill="#E0FFE0" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="94.0449" x="1532.3398" y="272.2637"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="27.3984" x="1542.3398" y="293.8652">hold</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0449" x="1542.3398" y="307.998">hold the flag</text><rect fill="#EEEEEE" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.2539" x="1544.2354" y="355.5293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="1554.2354" y="377.1309">&#128266;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="30.457" x="1574.0322" y="377.1309">none</text><polygon fill="#FFF6D5" points="1488.8191,423.9277,1500.8191,435.9277,1488.8191,447.9277,1476.8191,435.9277,1488.8191,423.9277" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#FFF6D5" points="1749.4919,180.3535,1954.5227,180.3535,1966.5227,193.3086,1954.5227,206.2637,1749.4919,206.2637,1737.4919,193.3086,1749.4919,180.3535" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="1856.0073" y="216.8984">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.4268" x="1749.4919" y="190.9883">we were holding, and the lid is closed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="205.0308" x="1749.4919" y="203.9434">with nothing else keeping the Mac up?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="1966.5227" y="190.9883">no</text><rect fill="#FFF0D0" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.9004" x="1752.0571" y="239.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49.7051" x="1762.0571" y="260.8203">farewell</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.9004" x="1762.0571" y="274.9531">the work finished under the lid</text><polygon fill="#FFF6D5" points="1822.3535,322.4844,1881.6611,322.4844,1893.6611,334.4844,1881.6611,346.4844,1822.3535,346.4844,1810.3535,334.4844,1822.3535,322.4844" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="59.3076" x="1822.3535" y="338.6416">on battery?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="1792.8706" y="332.1641">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="172.6484" x="1893.6611" y="332.1641">no &#8212; on AC, no external display</text><rect fill="#FFB0B0" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.3066" x="1648.1948" y="356.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="1658.1948" y="378.0859">&#128266;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="67.6055" x="1677.9917" y="378.0859">dyingPulse</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.0938" x="1658.1948" y="392.2188">the whole &#129728; flatline:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.3066" x="1658.1948" y="406.3516">two last beats, then the long tone</text><rect fill="#D0E4FF" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="126.3301" x="1884.5015" y="356.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="1894.5015" y="378.0859">&#128266;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="51.6504" x="1914.2983" y="378.0859">flatTone</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.3301" x="1894.5015" y="392.2188">only the long tone</text><polygon fill="#FFF6D5" points="1852.0073,424.8828,1864.0073,436.8828,1852.0073,448.8828,1840.0073,436.8828,1852.0073,424.8828" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FDFDFD" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.9941" x="1770.0103" y="483.8828"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.9941" x="1780.0103" y="505.4844">flag off, pmset sleepnow</text><rect fill="#EEEEEE" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.1035" x="2076.3096" y="308.4189"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="44.291" x="2086.3096" y="330.0205">release</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.1035" x="2086.3096" y="344.1533">flag off &#8212; the Mac may sleep,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.4219" x="2086.3096" y="358.2861">the mode stays armed</text><rect fill="#EEEEEE" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.2539" x="2137.7344" y="405.8174"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="2147.7344" y="427.4189">&#12826