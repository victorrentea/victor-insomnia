ily="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="59.1855" x="1308.7339" y="378.0859">heartbeat</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.2656" x="1288.937" y="392.2188">one lub-dub</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.2422" x="1288.937" y="406.3516">(three quick ones on the first beat)</text><rect fill="#E0FFE0" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="94.0449" x="1524.1221" y="273.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="27.3984" x="1534.1221" y="294.8203">hold</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0449" x="1534.1221" y="308.9531">hold the flag</text><rect fill="#EEEEEE" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.2539" x="1536.0176" y="356.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="1546.0176" y="378.0859">&#128266;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="30.457" x="1565.8145" y="378.0859">none</text><polygon fill="#FFF6D5" points="1480.6013,424.8828,1492.6013,436.8828,1480.6013,448.8828,1468.6013,436.8828,1480.6013,424.8828" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#FFF6D5" points="1741.2742,180.3535,1946.3049,180.3535,1958.3049,193.3086,1946.3049,206.2637,1741.2742,206.2637,1729.2742,193.3086,1741.2742,180.3535" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="1847.7896" y="216.8984">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.4268" x="1741.2742" y="190.9883">we were holding, and the lid is closed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="205.0308" x="1741.2742" y="203.9434">with nothing else keeping the Mac up?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="1958.3049" y="190.9883">no</text><rect fill="#FFF0D0" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="238.2324" x="1724.6733" y="239.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49.7051" x="1734.6733" y="260.8203">farewell</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1719" x="1734.6733" y="274.9531">the work finished (or the internet</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.2324" x="1734.6733" y="289.0859">has been gone &#8805; 5 min) under the lid</text><polygon fill="#FFF6D5" points="1814.1357,336.6172,1873.4434,336.6172,1885.4434,348.6172,1873.4434,360.6172,1814.1357,360.6172,1802.1357,348.6172,1814.1357,336.6172" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="59.3076" x="1814.1357" y="352.7744">on battery?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="1784.6528" y="346.2969">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="172.6484" x="1885.4434" y="346.2969">no &#8212; on AC, no external display</text><rect fill="#FFB0B0" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.3066" x="1639.9771" y="370.6172"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16" x="1649.9771" y="392.2188">&#12