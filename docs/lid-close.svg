family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="60.8877" x="2014.4023" y="838.0137">flat tone</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.1455" x="2075.29" y="838.0137">, whatever the reason</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="460.0928" x="1790.3203" y="854.502">(no work, work just finished, battery already low, mode Off, on AC).</text></g><?plantuml-src nLTDRzj64BthLmnIj9O8oLRI90ta886j3oH0MwUEqfClAt8bigPsMUxIYcuv5MYFQUwvzDJyA_-2_8I-sUM7B0bk2YIeRS0skJFxPkRDcz41JP-DwUNPg_FXcCucD3r_DNr6SvtJAXQMdYkZboeH56bfkYHKv9ydbemkL6GeJIvb5m-b8XlBrW4UH1IcsaXJ7lTlQ2QibVcQya8PqeMbziz9Q7NUfNlzUmzxT_kzk_SxXwq3k3XbrsIrimjr1ECrVPz4vqKgpIWHYrmifz9OCy1XeXx9A_OS14eiPH1Ged0rYT0cMj5ClwO4MDZ1oKfSoXSwJSBruOb_7GeZVM0p4LuUtt3uyVsxFpQyxd7oqY6zpKSamyJWeWC3M5bXuIINBh1C80o9d20Tyst7R8QuZvmlyia-KpWqvDJIKVLaceIN_cefmXW-RGpdkIuMCSKIDm6rLf9olS8jfRTzgJnaKuFyqp0MQY4HQuuptiayoOtjCcfVoyo1t7W0zxvqvr95CXzGbWfbYsLAFMkk5g1FQ8x0Z9vZnc76RwWDblLifXQTLiic5fVLTBj-ywuX4drJasUUQWtlZeEno3AfJBTaf05KaKUjbhb4eZctn2M-Ikpw55LPv9omeKvnwLUJ4N_lEOcCBBMATWqcauUZ1ni6FsehTqwDnvC7ayccsno9AL_UTr-0PqLkyMkLM1IilH6AZ9uY4mTq_UxDb_jnvNAfrKkqQAHNwlDVsEAEe7PJmkX2jK4eALBIYFJwjxV-CSbe8RiNIcaBmaKYloHkWWuX4KJ9dDeYNygeIzp8dWDTJmAoO3xUNAYA6uyX95y_xNXIjjVIT5fCza4G8EKg6Y7I872FbYmfm41dypcx4mlq1lxw-Fxl3wJHjgbO7zFZnoZxk3_kFta2AvaQMUDn3TS-ILTY3Vu1ZA1XAWfuNUaSrLzqTd6mSHF5xdk7T2Q5BK4InJgDNBaOeSCpxZCYXySZehRIhbdW-MIuuOXjFzcHYfBvTeXeAqJ3pS_M2Cch30eLuvyBvMw_b38pphE9eUXSxYBRMu8vL6ybqxJ4L84Xb6PjOEH6ZdF4_LGcVz8VDSddK6jtkKmbA5PwAq61EYm2gJSVkozlxW8i2SMJpDtqWmZTzGpPqTENyCYNrOKDpROSDydNA9e2UwF4GDhMe1tmlamH_oWnOfQ24xb8cD4OLH0noQBBi3kxsIZ72cHQofyAqFWKLJTrPl2KqcBMYugP6T2TvmGXOPmSOP7TSS4D7qs-6pugwuVmeS398hPblHkQkK0_ld_xfnD7o_GgppXGeSZpHFA4AAVLtJwPYXFERskBPubJseLcC1ZGXZDmCooKrKuHVHcFLkcwAhTD4oKn25Fjh94XkFGXyFNkMEJYp0g-5B14eo7kODknXelCfBd-_I_wbWmIxcoTIowFwRWiZVhZ-vD9cQL1jZJIUiHAhuuRNdm1nNLmiD8O6MfUPL3aBo