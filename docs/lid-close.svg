g" textLength="234.8486" x="1949.1797" y="813.3047">, and then the work finishes or the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="458.9717" x="1782.1025" y="829.793">battery crosses the floor. Closing the lid never plays it &#8212; a lid close</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.6523" x="1782.1025" y="846.2813">that ends in sleep plays only the</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="60.8877" x="2006.1846" y="846.2813">flat tone</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.1455" x="2067.0723" y="846.2813">, whatever the reason</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="460.0928" x="1782.1025" y="862.7695">(no work, work just finished, battery already low, mode Off, on AC).</text></g><?plantuml-src nLTDRzj64BthLmnIj9O4sLRI90ti886j3oH0MwUEqvClAt8bigPs5UxIYcuv5KYFQUwvj9VcN_aNv2VqpIn9oPBWfcY2EW5iaBkpR-QzURFSeRCd0tf-ykAqDw2J8PsTlZXxGcERqpnHdfuQPwScLHHRxJgaJ1oUfvwSBKpiA4ilT0SFjI6VwCOE7iGKPTPfLouFRsYalDVvWlB2EBA5f-RFQUHjtg4xtJltTsztTs_VRUqrTX3Yc4EJjx8liZ4sB-ZxD3ujCktwgPhaQdgcdNS7M4oqI_gI8xVRHarrkqsfmT6a8fzQGoFxYb9WuG17StMXdzaiZHPxH-5rf9mEYOrKT75uBU37z-z-Mucw9SXpGNfJZ5X7gSD1EmwmPeL7a5nBOZE5D3HgWdACrmFpDkIzBx4e5Fl4O56FIqlxrPEpDBe8HsiL9OZf4mJFRJ59AD4u2QYjqPJREKufesqhvHvlTQW_zH9b9XgvvbWJWepJtFaEemvSpWJaoWE43zITQXFh_81ccJA-c6Qqwztb1FA9t3wKiIlAs9ln6sf2PRj-PYQjHiEd7eVLShjw_Muf9Fgc5iyuinRHHOE9cisqSPrIaGvGLHut6ku2XURQ4bDycVh5CLYPv5omdirmw5V3Fl_RiX8LcLeJRsuO3k_txwri-D5wlR5gC1ZU6mvNm-OeJFdohlm0dbUvnwzvwa5OSoKL7Jz69NRewjthB_TVw9BIsYbQDBPpy_aFR717K7D9ONnkcX2KLXbPP7hrwzlmc7GyqPrpOwo7u6ALNn0tGOjG2A9qJ4sLJtNS8Mxae85E405vA1zlpasbZOSmagyVju8ecmljMWqM-q6xZPARk8zCssrvD6LB0GOw6Oyvd9gWD_3Nn_T_VI2BjitKuf0UFWJjW-wW--WHTkdCwHgFD5ppA9kh1VG7C8fwcIeGTMvpi3yvDw0tGSS3cT6U7Kdghf